<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <!-- TailwindCss -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .font-poppins {
            font-family: "Poppins", sans-serif;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clifford: '#da373d',
                        'bike-primary': '#E76F51',
                    }
                }
            }
        }
    </script>

</head>
<body>
      <!-- header section -->
       <header class="">
        <nav>
          <!-- slider section -->
          <div class="carousel w-full h-[300px] lg:h-[400px]">
            <div id="slide1" class="carousel-item relative w-full">
                  <img 
                  src="images/slider/photo1.jpg" 
                  class="w-full" />
              <div class="absolute left-5 right-5 top-1/2 flex -translate-y-1/2 transform justify-between">
                <a href="#slide4" class="btn btn-circle">❮</a>
                <a href="#slide2" class="btn btn-circle">❯</a>
              </div>
            </div>
            <div id="slide2" class="carousel-item relative w-full">
              <img
                src="images/slider/photo2.jpg"
                class="w-full" />
              <div class="absolute left-5 right-5 top-1/2 flex -translate-y-1/2 transform justify-between">
                <a href="#slide1" class="btn btn-circle">❮</a>
                <a href="#slide3" class="btn btn-circle">❯</a>
              </div>
            </div>
            <div id="slide3" class="carousel-item relative w-full">
              <img
                src="images/slider/photo3.jpg"
                class="w-full" />
              <div class="absolute left-5 right-5 top-1/2 flex -translate-y-1/2 transform justify-between">
                <a href="#slide2" class="btn btn-circle">❮</a>
                <a href="#slide4" class="btn btn-circle">❯</a>
              </div>
            </div>
            <div id="slide4" class="carousel-item relative w-full">
              <img
                src="https://img.daisyui.com/images/stock/photo-1665553365602-b2fb8e5d1707.webp"
                class="w-full" />
              <div class="absolute left-5 right-5 top-1/2 flex -translate-y-1/2 transform justify-between">
                <a href="#slide3" class="btn btn-circle">❮</a>
                <a href="#slide1" class="btn btn-circle">❯</a>
              </div>
            </div>
          </div>
             <!-- nav section -->
            <div class="navbar justify-center absolute top-0 left-0 w-full lg:px-24">
                <div class="navbar-start">
                  <div class="dropdown">
                    <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-5 w-5"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M4 6h16M4 12h8m-8 6h16" />
                      </svg>
                    </div>
                    <ul
                      tabindex="0"
                      class="menu menu-sm dropdown-content bg-base-100 rounded-box z-[1] mt-3 w-32 p-2 shadow navber-end">
                      <li><a>Home</a></li>
                     <li><a>About Us</a></li>
                     <li><a>Contact Us</a></li>
                     <li><a>Product</a></li>
                    </ul>
                  </div>
                  <a class="btn btn-ghost text-xl">daisyUI</a>
                </div>
                <div class="navbar-center hidden lg:flex hover:text-teal-300">
                  <ul class="menu menu-horizontal px-1 justify-center">
                     <li><a>Home</a></li>
                     <li><a>About Us</a></li>
                     <li><a>Contact Us</a></li>
                     <li><a>Product</a></li>
                  </ul>
                </div>
                <div class="navbar-end">
                  <a class="btn w-28 hover:bg-gradient-to-r from-yellow-100 to-sky-200">Button</a>
                </div>
              </div>
        </nav>
       </header>
       <main>
        <!-- Featured biked -->
        <section>
           <div>
            <!-- text section -->
               <div class="text-center my-9">
                <h2 class="text-2xl font-bold">Fetured Bikes In This Year</h2>
                <p class="text-sm text-red-500">Best bike collection</p>
               </div>
               <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 justify-center mx-9 lg:mx-8">
                   <img class="w-96 -hue-rotate-180" src="images/others/cfmotor 1.jpg" alt="">
                   <img class="w-96 -hue-rotate-180" src="images/others/cfmotor 2.jpeg" alt="">
                   <img class="w-96 -hue-rotate-180" src="images/others/cfmotor 3.jpg" alt="">
               </div>
           </div>
        </section>
       </main>

</html>
